version: "3.8"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/whathappenedtoday}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-whathappenedtoday}
      - JAVA_OPTS=-Xmx512m -Xms256m
      # You can add more environment variables here
      # - SOME_API_KEY=${SOME_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - whathappenedtoday-network
    restart: always
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - whathappenedtoday-network
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    # If you need MongoDB environment variables
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-}

networks:
  whathappenedtoday-network:
    driver: bridge

volumes:
  mongodb-data:
